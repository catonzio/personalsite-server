http:
  middlewares:
    services:
      basicAuth:
        users:
          # htpasswd line ("user:$2y$..."), from TRAEFIK_BASIC_AUTH_USERS in ./.env
          - '{{ env "TRAEFIK_BASIC_AUTH_USERS" }}'
    compress:
      compress: {}
    hsts:
      headers:
        stsSeconds: 2592000
    redirect-to-portfolio:
      redirectRegex:
        regex: "^https?://([^/]+)/?$"
        replacement: "https://${1}/portfolio/"
        permanent: true
  routers:
    root-redirect:
      rule: "Path(`/`)"
      entrypoints:
        - websecure
      middlewares:
        - redirect-to-portfolio
      service: api@internal
      priority: 1
      tls: {}
    api:
      rule: Host(`traefik.danilocatone.com`)
      entrypoints:
        - websecure
      middlewares:
        - services
      service: api@internal
      # This router requests the wildcard certificate; every other router is served
      # with it automatically through SNI matching
      tls:
        certResolver: letsencrypt
        domains:
          - main: danilocatone.com
            sans:
              - "*.danilocatone.com"

tls:
  options:
    default:
      cipherSuites:
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256
      sniStrict: true