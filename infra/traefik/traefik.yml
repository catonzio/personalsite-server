# Traefik static configuration
api:
  dashboard: true
  insecure: true # Enable dashboard without auth for local dev

entryPoints:
  web:
    address: ":80"
    # Redirect HTTP to HTTPS
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ":443"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false # Only services with traefik.enable=true
    watch: true # Auto-discover new containers

  file:
    directory: /etc/traefik/conf.d
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: danilocatone@gmail.com
      storage: /letsencrypt/acme.json
      # DNS-01 through the IONOS DNS API (needed for the wildcard certificate)
      dnsChallenge:
        provider: ionos
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"

log:
  level: INFO
