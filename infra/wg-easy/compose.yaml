services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15
    container_name: wg-easy
    networks:
      traefik-network:
        # Default route via eth0 (traefik-network), where wg-easy's default
        # PostUp hook already applies MASQUERADE for 10.8.0.0/24.
        gw_priority: 1
      wg: {}

    environment:
      # - LANG=en
      - WG_HOST=danilocatone.com
      - INSECURE=true
      # Unattended setup (v15): used ONLY on first start, when the DB in
      # ./wg-easy is empty. Ignored afterwards. Credentials come from .env.
      - INIT_ENABLED=true
      - INIT_USERNAME=${INIT_USERNAME:?set INIT_USERNAME in .env}
      - INIT_PASSWORD=${INIT_PASSWORD:?set INIT_PASSWORD in .env}
      - INIT_HOST=danilocatone.com
      - INIT_PORT=51820
      - INIT_DNS=1.1.1.1,1.0.0.1
      - INIT_IPV4_CIDR=10.8.0.0/24
      - INIT_IPV6_CIDR=fdcc:ad94:bacf:61a4::cafe:0/112
      # Split tunnel: only VPN subnet + home LAN go through the tunnel.
      - INIT_ALLOWED_IPS=10.8.0.0/24,192.168.1.0/24
      # - PASSWORD_HASH=$$2a$$12$$uGpbM4TOLaFcJu5o7hCNZurABQ6IY30Rxfb9G36AVelymM2bXQsry
      # - WG_PORT=51820
      # - WG_DEFAULT_DNS=1.1.1.1
      # - WG_ALLOWED_IPS=0.0.0.0/0
      # - WG_POST_UP=iptables -t nat -A POSTROUTING -s 10.8.0.0/24 -o eth1 -j MASQUERADE; iptables -A INPUT -p udp -m udp --dport 51820 -j ACCEPT; iptables -A FORWARD -i wg0 -j ACCEPT; iptables -A FORWARD -o wg0 -j ACCEPT
      # NOTE: WG_* vars are v14-only and ignored by v15 (hooks live in the DB).
      # - WG_POST_DOWN=iptables -t nat -D POSTROUTING -s 10.8.0.0/24 -o eth1 -j MASQUERADE; iptables -D INPUT -p udp -m udp --dport 51820 -j ACCEPT; iptables -D FORWARD -i wg0 -j ACCEPT; iptables -D FORWARD -o wg0 -j ACCEPT
    labels:
      - "traefik.enable=true"
      # - "traefik.http.routers.wg-easy.rule=Host(`danilocatone.com`)"
      - "traefik.http.routers.wg-easy.rule=PathPrefix(`/wg-easy`)"
      - "traefik.http.routers.wg-easy.entrypoints=web,websecure"
      # - "traefik.http.routers.wg-easy.service=wg-easy"
      - "traefik.http.routers.prova-api.tls=true"
      - "traefik.http.services.wg-easy.loadbalancer.server.port=51821"
      - "traefik.docker.network=traefik-network"
    volumes:
      - ./wg-easy:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    ports:
      - "51820:51820/udp"
      - "51821:51821/tcp"         # web UI
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.default.forwarding=1
    restart: unless-stopped

  wg-easy-setup:
    image: alpine:latest
    container_name: wg-easy-setup
    network_mode: "service:wg-easy"
    depends_on:
      - wg-easy
    cap_add:
      - NET_ADMIN
    command: >
      sh -c "sleep 10 && 
             apk add --no-cache iptables && 
             iptables -t nat -A POSTROUTING -d 192.168.1.0/24 -o eth1 -j MASQUERADE || true &&
             echo 'iptables rule applied' &&
             tail -f /dev/null"
    restart: unless-stopped

networks:
  # Shared network with Traefik
  traefik-network:
    external: true
  wg:
    driver: bridge
    enable_ipv6: true
    ipam:
      driver: default
      config:
        - subnet: 10.42.42.0/24
        - subnet: fdcc:ad94:bacf:61a3::/64
