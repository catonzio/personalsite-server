# One sample per minute; retention (180d) is set on the command line in compose.yaml.
global:
  scrape_interval: 60s
  scrape_timeout: 15s
  evaluation_interval: 60s

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["host.docker.internal:9100"]
        labels:
          instance: xps-server
