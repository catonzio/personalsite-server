# infra-dashboard: static page + read-only proxies for the Monitor tab.
# Reached via Traefik (/infra, prefix stripped, basicAuth) or locally on
# 127.0.0.1:8090 (kiosk). Only GET/HEAD on an allowlist of data endpoints.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS, resolved per request: nginx starts even if an upstream is down.
    resolver 127.0.0.11 valid=30s ipv6=off;

    location / {
        try_files $uri $uri/ =404;
    }

    # Traefik API (routers list for the Services tab). Remotely Traefik answers
    # /infra/api/ itself; this is used by the local kiosk.
    location /api/ {
        limit_except GET { deny all; }
        set $traefik http://traefik:8080;
        proxy_pass $traefik;
    }

    # Glances live stats: only the plugins the page reads.
    location ~ ^/glances/(api/4/(?:system|uptime|quicklook|cpu|percpu|load|mem|memswap|sensors|processcount|processlist/top/[0-9]+))$ {
        limit_except GET { deny all; }
        set $glances http://glances:61208;
        proxy_pass $glances/$1;
    }

    # Prometheus history: instant and range queries only.
    location ~ ^/prom/(api/v1/(?:query|query_range))$ {
        limit_except GET { deny all; }
        set $prometheus http://prometheus:9090;
        proxy_pass $prometheus/$1$is_args$args;
    }
}
