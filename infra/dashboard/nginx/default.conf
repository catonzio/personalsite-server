# infra-dashboard: static page + read-only proxies for the Monitor tab.
# Reached via Traefik (/infra, prefix stripped, basicAuth) or locally on
# 127.0.0.1:8090 (kiosk). Only GET/HEAD on an allowlist of data endpoints.
# Short cache for the Glances process list (see the processlist location).
proxy_cache_path /var/cache/nginx/glances levels=1 keys_zone=glances:1m max_size=10m inactive=1m use_temp_path=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS, resolved per request: nginx starts even if an upstream is down.
    resolver 127.0.0.11 valid=30s ipv6=off;

    location / {
        try_files $uri $uri/ =404;
    }

    # Traefik API (routers list for the Services tab). Remotely Traefik answers
    # /infra/api/ itself; this is used by the local kiosk.
    location /api/ {
        limit_except GET { deny all; }
        set $traefik http://traefik:8080;
        proxy_pass $traefik;
    }

    # Glances process list, cached 2s and shared by all open pages. Every
    # request makes Glances rescan processes, and per-process CPU% is measured
    # since the previous scan: two scans a few ms apart (two pages polling)
    # would show bogus values like 400%. The cache keeps scans >= 2s apart.
    location ~ ^/glances/(api/4/processlist/top/[0-9]+)$ {
        limit_except GET { deny all; }
        set $glances http://glances:61208;
        proxy_pass $glances/$1;
        proxy_cache glances;
        proxy_cache_key $1;
        proxy_cache_valid 200 2s;
        proxy_cache_lock on;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
    }

    # Glances live stats: only the plugins the page reads.
    location ~ ^/glances/(api/4/(?:system|uptime|quicklook|cpu|percpu|load|mem|memswap|sensors))$ {
        limit_except GET { deny all; }
        set $glances http://glances:61208;
        proxy_pass $glances/$1;
    }

    # Prometheus history: instant and range queries only.
    location ~ ^/prom/(api/v1/(?:query|query_range))$ {
        limit_except GET { deny all; }
        set $prometheus http://prometheus:9090;
        proxy_pass $prometheus/$1$is_args$args;
    }
}
