<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Home server</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="monitor.css">
</head>
<body>
  <main>
    <header class="top">
      <div>
        <h1>Home server</h1>
        <p class="sub">danilocatone.com</p>
      </div>
      <nav class="tabs" role="tablist">
        <a href="#services" role="tab" data-tab="services">Services</a>
        <a href="#monitor" role="tab" data-tab="monitor">Monitor</a>
      </nav>
    </header>
    <div id="tab-services" role="tabpanel">
      <div id="groups"></div>
    </div>
    <div id="tab-monitor" role="tabpanel" hidden></div>
  </main>
  <script src="services.js"></script>
  <script src="monitor.js"></script>
  <script>
    // Tabs: selected by URL hash (#services, #monitor), so a bookmark or the
    // kiosk can open a tab directly.
    function showTab() {
      const tab = location.hash === "#monitor" ? "monitor" : "services";
      for (const a of document.querySelectorAll(".tabs a")) {
        a.setAttribute("aria-selected", String(a.dataset.tab === tab));
      }
      document.getElementById("tab-services").hidden = tab !== "services";
      document.getElementById("tab-monitor").hidden = tab !== "monitor";
      document.body.classList.toggle("wide", tab === "monitor");
      Monitor.setActive(tab === "monitor");
    }
    window.addEventListener("hashchange", showTab);
    showTab();
  </script>
  <script>
    const root = document.getElementById("groups");

    function card({ name, desc, url, badge }) {
      const a = document.createElement("a");
      a.className = "card";
      a.href = url;
      a.target = "_blank";
      a.rel = "noopener";
      a.innerHTML = '<span class="name"></span><span class="desc"></span><span class="url"></span>';
      a.querySelector(".name").textContent = name;
      if (badge) {
        const b = document.createElement("span");
        b.className = "badge";
        b.textContent = badge;
        a.querySelector(".name").append(b);
      }
      a.querySelector(".desc").textContent = desc || "";
      a.querySelector(".url").textContent = url.replace(/^https?:\/\//, "");
      return a;
    }

    function section(title, note) {
      const s = document.createElement("section");
      const h2 = document.createElement("h2");
      h2.textContent = title;
      const n = document.createElement("span");
      n.className = "note";
      n.textContent = note;
      h2.append(n);
      const grid = document.createElement("div");
      grid.className = "grid";
      s.append(h2, grid);
      root.append(s);
      return grid;
    }

    // Infrastructure: static list from services.js
    const infraGrid = section("Infrastructure", "Home LAN or VPN only");
    for (const s of INFRA) {
      infraGrid.append(card({ ...s, url: `${s.scheme}://${LAN_HOST}:${s.port}${s.path}` }));
    }

    // Apps: one card per top-level path found in enabled Traefik routers.
    const appsGrid = section("Apps", "Discovered from Traefik");

    function appsFromRouters(routers) {
      const apps = new Map();
      for (const r of routers) {
        if (r.status !== "enabled" || r.name.endsWith("@internal")) continue;
        const auth = (r.middlewares || []).some((m) => /auth/i.test(m));
        for (const [, path] of (r.rule || "").matchAll(/(?:PathPrefix|Path)\(`([^`]*)`\)/g)) {
          const seg = path.split("/")[1];
          if (!seg || HIDDEN_PATHS.includes(seg)) continue;
          const app = apps.get(seg) || { auth: false };
          app.auth = app.auth || auth;
          apps.set(seg, app);
        }
      }
      return [...apps.entries()].sort(([a], [b]) => a.localeCompare(b));
    }

    fetch("api/http/routers?per_page=1000", { credentials: "same-origin" })
      .then((r) => (r.ok ? r.json() : Promise.reject(new Error(`HTTP ${r.status}`))))
      .then((routers) => {
        const apps = appsFromRouters(routers);
        if (!apps.length) appsGrid.textContent = "No apps found.";
        for (const [seg, app] of apps) {
          appsGrid.append(card({
            name: seg,
            url: `${location.origin}/${seg}/`,
            badge: app.auth ? "login" : "",
          }));
        }
      })
      .catch((err) => {
        appsGrid.textContent = `Could not load apps from Traefik (${err.message}).`;
      });
  </script>
</body>
</html>
