services:
  waha:
    image: devlikeapro/waha
    container_name: waha
    env_file:
      - .env
    volumes:
      - ./sessions:/app/.sessions
    ports:
      - "2000:3000"
    stdin_open: true
    tty: true
    networks:
      - traefik-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.waha.rule=PathPrefix(`/waha`)"
      - "traefik.http.routers.waha.tls=true"
      - "traefik.http.routers.waha.entrypoints=web,websecure"
      - "traefik.http.routers.waha.middlewares=waha-strip"
      - "traefik.http.middlewares.waha-strip.stripprefix.prefixes=/waha"
      - "traefik.http.services.waha.loadbalancer.server.port=3000"
      - "traefik.docker.network=traefik-network"

networks:
  traefik-network:
    external: true
